# phrases_ar.yaml — بنك عبارات تركيب رسائل التقديم بالعربية (B4).
#
# يستخدمها core/app/composer.py لبناء رسالة تقديم فريدة وحتمية لكل زوج
# (عميل، وظيفة) — حتمية بمعنى: نفس (customer_id, job_key) يُنتج دائمًا نفس
# الاختيار (بذرة sha256، لا عشوائية حقيقية) حتى تبقى الرسالة قابلة لإعادة
# الإنتاج لأغراض المراجعة/الاختبار، مع تنويع كافٍ بين عملاء/وظائف مختلفة
# لتفادي نمط رسائل متطابق يلفت انتباه فلاتر البريد أو الموظّف نفسه.
#
# {title}/{years}/{skill_a}/{skill_b} تُستبدَل وقت التركيب من ملف العميل/الوظيفة.

openings:
  - "السلام عليكم ورحمة الله وبركاته،"
  - "تحية طيبة وبعد،"
  - "السلام عليكم،"
  - "أتشرف بالتواصل معكم بخصوص الوظيفة المعلن عنها."
