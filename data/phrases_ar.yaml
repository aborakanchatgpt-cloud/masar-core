  - "أكتب إليكم بخصوص إعلان التوظيف الأخير لديكم."
  - "أتقدّم بطلبي هذا للانضمام إلى فريقكم الموقّر."
  - "تحياتي، وأتمنى أن تصلكم رسالتي وأنتم بخير."
  - "يشرّفني التقدّم لشغل هذا المنصب لدى مؤسستكم."
  - "أود التعبير عن اهتمامي الكبير بالانضمام إلى شركتكم."
  - "أتواصل معكم بخصوص شاغر وظيفي أراه مناسبًا جدًا لخبرتي."
  - "بعد اطلاعي على إعلان الوظيفة، وددت التقدّم لها مباشرة."
  - "تحية طيبة، أكتب إليكم راغبًا بالانضمام لفريق عملكم."
  - "يسرّني أن أتقدّم لهذا المنصب الذي يتوافق تمامًا مع مسيرتي المهنية."
  - "أتقدّم لكم بسيرتي الذاتية آملًا أن أكون إضافة لفريقكم."
  - "تحيةً طيبةً لفريق التوظيف الموقّر،"
  - "يطيب لي التواصل معكم بخصوص الشاغر المُعلن."
  - "أتقدم لهذه الوظيفة بثقة تامة في توافق خبرتي معها."
  - "أرحب بفرصة الانضمام إلى مؤسستكم العريقة."
  - "أكتب لكم اليوم لأعبّر عن رغبتي الجادة في هذا المنصب."

why_me:
  - "أمتلك خبرة {years} سنوات في مجالات تشمل {skill_a} و{skill_b}، وأرى أن هذه الخلفية تتوافق تمامًا مع متطلبات وظيفة {title}."
  - "خلال مسيرتي المهنية التي تمتد {years} سنوات، طوّرت مهارات قوية في {skill_a} و{skill_b}، وهو ما يؤهّلني للمساهمة الفعّالة في هذا الدور."
  - "أرى أن خبرتي العملية في {skill_a}، إلى جانب إلمامي بـ{skill_b}، تجعلني مرشّحًا مناسبًا لوظيفة {title}."
  - "بخبرة تقارب {years} سنوات، تمكّنت من صقل مهاراتي في {skill_a} و{skill_b} بما يخدم متطلبات هذا المنصب."
  - "أعتقد أن مزيجًا من خبرتي في {skill_a} وقدرتي على {skill_b} سيضيف قيمة حقيقية لفريقكم."
  - "على مدار {years} سنوات من العمل، اكتسبت فهمًا عميقًا لـ{skill_a}، مع خبرة عملية في {skill_b}."
  - "أجمع بين معرفة تقنية بـ{skill_a} وخبرة تطبيقية في {skill_b}، وهو ما أراه مناسبًا لمتطلبات {title}."
  - "أعمل بخبرة {years} سنوات ضمن هذا التخصص، مع تركيز خاص على {skill_a} و{skill_b}."
  - "أثق بأن خلفيتي في {skill_a}، مدعومة بخبرة {years} سنوات، تجعلني خيارًا مناسبًا لهذا الدور."
  - "طوال مسيرتي، ركّزت على تطوير مهاراتي في {skill_a} و{skill_b} لتلبية متطلبات أدوار مشابهة لـ{title}."
  - "أمتلك سجلّا حافلًا في {skill_a}، وخبرة تكميلية في {skill_b} تمتد {years} سنوات."
  - "أرى تطابقًا واضحًا بين متطلبات وظيفة {title} وخبرتي العملية في {skill_a} و{skill_b}."
  - "خبرتي الممتدة {years} سنوات في {skill_a} تؤهّلني لتحقيق نتائج ملموسة بهذا المنصب."
  - "أتمتع بقدرة عملية على {skill_a}، إضافة إلى إلمام جيد بـ{skill_b}."
  - "أعمل منذ {years} سنوات على تطوير خبرتي في {skill_a} وما يتصل بها من {skill_b}."

