# taxonomy_local.yaml — معجم العائلات المهنية المستهدفة (مسودة أولى، المرحلة 2)
#
# كل عائلة: قائمة كلمات مفتاحية (عربي/إنجليزي) تُستخدم في مرحلة الوسم الأولي
# (Taxonomy Tagger) قبل الاعتماد الكامل على ESCO. Source Curator (جلسة Claude
# أسبوعية) يراجع ويوسّع هذه القوائم تدريجيًا مع كل دفعة شركات جديدة — هذا الملف
# بداية معقولة مبنية على مجال أحمد (الهندسة الكيميائية) والعائلات المطلوبة في
# الدليل، وليس نهائيًا.
#
# مراجعة B2 R6: أُضيفت 9 عائلات غير هندسية (hospitality..program_admin_ops)
# بعد أن أظهرت المراجعة أن 95.3% من الوظائف داخل النطاق تبقى "غير
# مصنّفة" لأن المعجم الأصلي هندسي/نفطي بحت بينما قاعدة الوظائف الفعلية
# (خصوصًا السعودية/الخليجية) تغطي قطاعات أوسع بكثير. كل الكلمات المفتاحية
# تُطابَق بحدود كلمة صريحة (\b...\b) على العنوان + أول 300 حرف من الوصف
# (discovery.py:classify_family) — التصنيف يأخذ أول عائلة تُطابق حسب ترتيب
# هذا الملف.
#
# تحديث ثانٍ (بعد فحص GET /admin/unclassified-sample على بيانات حية):
# وسّعت construction_pm/it_software/hse/finance_accounting/lab_chemistry/
# maintenance_ops/program_admin_ops/quality بكلمات وُجدت فعليًا بكثرة بعيّنة
# غير المصنّفة (مقاولات EPC/حفر متنوعة: Document Controller، Material
# Expeditor، Cost Engineer، Data Center Technician إلخ...).
#
# مراجعة B2 R12 (docs/reports/B2-review-2.md): توسعة ثالثة — مقتطف §5 من
# المراجعة الثانية، مبني على أعلى 30 مسمى غير مصنّف من عيّنة حية فعلية
# (Field Sales Consultant، Project Management Engineer، Field Operator،
# Asphalt Formulation Specialist، SCADA Technician، Maximo EAM Functional
# Specialist، High Voltage Technician، Enterprise Account Executive،
# Control Room Operator - DCS، Combustion Solutions Engineer، Risk Manager،
# Machinist، Electro-Mechanical Technician، Drilling Foreman إلخ). إضافات
# فقط — دُمجت داخل قوائم العائلات القائمة، لا استبدال.

