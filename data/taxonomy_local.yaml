# taxonomy_local.yaml — معجم العائلات المهنية المستهدفة (مسودة أولى، المرحلة 2)
#
# كل عائلة: قائمة كلمات مفتاحية (عربي/إنجليزي) تُستخدم في مرحلة الوسم الأولي
# (Taxonomy Tagger) قبل الاعتماد الكامل على ESCO. Source Curator (جلسة Claude
# أسبوعية) يراجع ويوسّع هذه القوائم تدريجيًا مع كل دفعة شركات جديدة — هذا الملف
# بداية معقولة مبنية على مجال أحمد (الهندسة الكيميائية) والعائلات المطلوبة في
# الدليل، وليس نهائيًا.
#
# مراجعة B2 R6: أُضيفت 9 عائلات غير هندسية (hospitality..program_admin_ops)
# بعد أن أظهرت المراجعة أن 95.3% من الوظائف داخل النطاق تبقى "غير
# مصنّفة" لأن المعجم الأصلي هندسي/نفطي بحت بينما قاعدة الوظائف الفعلية
# (خصوصًا السعودية/الخليجية) تغطي قطاعات أوسع بكثير. كل الكلمات المفتاحية
# تُطابَق بحدود كلمة صريحة (\b...\b) على العنوان أولاً، ثم على الوصف
# كملاذ أخير حين لا يُطابق العنوان وحده شيئًا (discovery.py:classify_family،
# مراجعة B2b) — كلا النصّين يمرّان أولاً بخطوة تطبيع (تشكيل عربي/همزات/تاء
# مربوطة، بادئات أقدمية إنجليزية Sr./Jr.، أرقام رومانية لاحقة، علامات ترقيم
# وشرطات مائلة) قبل المطابقة، فتُطابَق الكلمة المفتاحية نفسها بصرف النظر عن
# هذه الاختلافات السطحية. التصنيف يأخذ أول عائلة تُطابق حسب ترتيب هذا الملف.
#
# تحديث ثانِ: وسّعت construction_pm/it_software/hse/finance_accounting/lab_chemistry/
# maintenance_ops/program_admin_ops/quality بكلمات وُجدت فعليًا بكثرة بعيّنة
# غير المصنّفة (مقاولات EPC/حفر متنوعة: Document Controller، Material
# Expeditor، Cost Engineer، Data Center Technician إلخ...).
#
# مراجعة B2 R12 (docs/reports/B2-review-2.md): توسعة ثالثة — مقتطف §5 من
# المراجعة الثانية، مبني على أعلى 30 مسمى غير مصنف من عيّنة حية فعلية
# (Field Sales Consultant، Project Management Engineer، Field Operator،
# Asphalt Formulation Specialist، SCADA Technician، Maximo EAM Functional
# Specialist، High Voltage Technician، Enterprise Account Executive،
# Control Room Operator - DCS، Combustion Solutions Engineer، Risk Manager،
# Machinist، Electro-Mechanical Technician، Drilling Foreman إلخ). إضافات
# فقط — دُمجت داخل قوائم العائلات القائمة، لا استبدال.
#
# مراجعة B2b (متابعة B2، PLAN.md §B2b): توسعة رابعة كبيرة — مبنية على أعلى
# 200 مسمى غير مصنف من GET /admin/unclassified-sample الحي (family_classified
# كان 31.9% وقت البدء). أُعيدت تسمية `sales_excluded` إلى `out_of_scope`
# (استُعمل عمومًا لأي دور خارج نطاق المنصّة صراحة — ليس مبيعات فقط) ووُسّعت
# قائمته بكلمات مفردة عامة (\bsales\b، \btelesales\b) تلتقط عشرات الصيغ
# دفعة واحدة بدل تعداد كل تركيبة "Sales X" على حدة. باقي العائلات وُسّعت
# بعبارات محدّدة (لا كلمات مفردة عامة الخطر كـ"manager"/"engineer" وحدها)
# لتفادي تصنيف خاطئ عابر للعائلات.
#
# مراجعة B2b (دفعة ثانية — بعد قياس التغطية الحية بعد أول reclassify وظهورها
# 65.2%/56.3% — دون هدفي 80%/70%): توسعة خامسة مبنية على أعلى 350 مسمى
# غير مصنف من عيّنة حية فعلية بعد التشغيلة الأولى. أُضيفت عائلة جديدة
# legal_compliance (قانوني/امتثال، كانت مفقودة سابقًا)، وأُضيفت كلمات عامة
# (bare) مدروسة الخطر لملاءمة طبيعة العيّنة الهندسية/الصناعية الغالبة:
# \btechnician\b و\bforeman\b → maintenance_ops، \bplanner\b/\bcost controller\b/
# \bcontract administrator\b → project_controls، \binspector\b/\bsurveyor\b →
# construction_pm (موضوعة متأخرًا بالقائمة حتى لا تطغي على hse/quality الأدق تحديدًا
# التي تُفحَص قبلها بترتيب هذا الملف)، \bexpeditor\b → supply_chain.

