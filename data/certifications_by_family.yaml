# مسار — شهادات احترافية معروفة فعليًا بسوق العمل السعودي/الخليجي، لكل
# عائلة من العائلات ـ 21 المهنية (نفس رموز FAMILY_BUTTON_ORDER بملف
# core/app/telegram_onboarding.py — لا يشمل out_of_scope/sales_excluded
# عمدًا، لا معنى لنصيحة تطوير مهني بمجال خارج نطاق الخدمة أصلًا).
#
# يُستخدَم من core/app/skill_gap.py (B4/v2-B6، 12 سبتمبر) كبديل مجاني
# بالكامل لاعتماد ANTHROPIC_API_KEY السابق (قرار أحمد: "طريقة مجانية") —
# لكل عائلة: 2-3 شهادات احترافية معروفة فعليًا بالسوق مع سبب موجز بجملة
# واحدة، ونصيحة مسيرة مهنية ثابتة بجملتين إلى ثلاث. القيم هنا معرفة عامة
# بالسوق (لا حاجة لأي مصدر بيانات حي) — تُختار الشهادات غير الموجودة أصلًا
# بـ`profiles.certs` للعميل (راجع `_pick_certifications` بـskill_gap.py).

chem_process:
  certifications:
    - name: "Six Sigma Green Belt"
      reason: "تثبت قدرتك على تحسين العمليات وتقليل الفاقد، وهي مطلوبة بكثرة بمصانع العمليات الكيميائية بالسعودية"
    - name: "HAZOP Leader Certification"
      reason: "قيادة دراسات تحليل المخاطر (HAZOP) مهارة محورية بالصناعات الكيميائية والبتروكيماوية وترفع فرصك بالمناصب الإشرافية"
    - name: "PMP (Project Management Professional)"
      reason: "كثير من مشاريع التوسعة بمصانع العمليات تحتاج مهندسًا يفهم إدارة المشاريع لا التشغيل فقط"
  advice: "ركّز على إبراز أي مشروع تحسين عملية شاركت فيه بسيرتك بأرقام واضحة (نسبة توفير، تقليل توقف)، فهذا ما يبحث عنه أصحاب العمل بمجال العمليات الكيميائية. استمر بمتابعة معايير السلامة الصناعية فهي جزء أساسي من تقييم أي مهندس عمليات."

quality:
  certifications:
    - name: "ISO 9001 Lead Auditor"
      reason: "شهادة معتمدة عالميًا تثبت قدرتك على تدقيق أنظمة إدارة الجودة، ومطلوبة بأغلب إعلانات وظائف الجودة بالسعودية"
    - name: "ASQ Certified Quality Engineer (CQE)"
      reason: "من أكثر الشهادات احترافية بمجال هندسة الجودة عالميًا، وتميّزك عن المتقدمين بلا شهادة مهنية"
  advice: "اذكر بسيرتك أي أداة تحكمت بها فعليًا لضبط الجودة (SPC، FMEA، 8D) بدل ذكر 'خبرة بالجودة' بشكل عام. أصحاب العمل يفضلون من يقدر يثبت أثر عمله بأرقام انخفاض نسبة العيوب أو الشكاوي."

hse:
  certifications:
    - name: "NEBOSH International General Certificate (IGC)"
      reason: "الشهادة الأكثر طلبًا بإعلانات وظائف السلامة بالخليج، وتُعتبر الحدّ الأدنى بكثير من الشركات الكبرى"
    - name: "OSHA 30-Hour Certification"
      reason: "معيار أمريكي معروف يثبت إلمامك بمعايير السلامة المهنية، ويُطلب كثيرًا بالمشاريع المرتبطة بشركات عالمية"
    - name: "IOSH Managing Safely"
      reason: "شهادة بريطانية معتمدة تناسب من يدير فريق سلامة لا فردًا فقط، وترفع فرصك بالمناصب الإشرافية"
  advice: "أبرز بسيرتك أي حادثة تعاملت معها فعليًا أو برنامج توعية نفّذته، فهذا يثبت خبرة عملية لا نظرية فقط. تابع تجديد شهاداتك دوريًا فمعظمها له صلاحية محددة ويُطلب إثباتها بالمقابلات."

maintenance_ops:
  certifications:
    - name: "Certified Maintenance & Reliability Professional (CMRP)"
      reason: "أرفع شهادة عالمية بمجال الصيانة والموثوقية، وتفتح لك أبواب المناصب الإشرافية والفنية المتقدمة"
    - name: "Certified Reliability Leader (CRL)"
      reason: "تركّز على قيادة برامج الموثوقية بالمصانع، مطلوبة بكثرة بالشركات الصناعية الكبرى بالسعودية"
  advice: "اذكر بسيرتك أنواع المعدات التي تعاملت معها بالتحديد (دوارة، ثابتة، كهربائية) بدل كلمة 'صيانة' العامة. خبرتك بأنظمة إدارة الصيانة (CMMS) مثل Maximo تُعتبر ميزة تنافسية قوية."

production:
  certifications:
    - name: "Six Sigma Green Belt"
      reason: "تثبت قدرتك على تحسين خطوط الإنتاج وتقليل الفاقد، وهي من أكثر الشهادات طلبًا بمجال الإنتاج الصناعي"
    - name: "Certified in Production and Inventory Management (CPIM)"
      reason: "شهادة معتمدة عالميًا بتخطيط الإنتاج والمخزون، تناسب من يريد التقدم لمناصب تخطيط الإنتاج"
  advice: "أبرز بسيرتك أي تحسين ملموس شاركت به بخط الإنتاج (زيادة الإنتاجية، تقليل التوقف) بأرقام واضحة. معرفتك بمبادئ الإنتاج الرشيق (Lean Manufacturing) تُحدث فرقًا كبيرًا بتقييم طلبك."

lab_chemistry:
  certifications:
    - name: "ISO/IEC 17025 Lab Quality Auditor"
      reason: "معيار الاعتماد الدولي للمختبرات، ومعرفتك به تثبت التزامك بجودة النتائج المخبرية"
    - name: "ASQ Certified Quality Technician (CQT)"
      reason: "شهادة معتمدة تجمع بين المهارات المخبرية وضبط الجودة، مطلوبة بمختبرات التحاليل الصناعية"
  advice: "اذكر بسيرتك الأجهزة التحليلية التي تجيد تشغيلها بالتحديد (HPLC، GC، أطياف الامتصاص) فهذا أهم من وصف عام لخبرتك المخبرية. الدقة والالتزام بإجراءات السلامة المخبرية نقطتان يبحث عنهما كل مسؤول توظيف بهذا المجال."

water_treatment:
  certifications:
    - name: "Water Treatment Plant Operator Certification (AWWA)"
      reason: "شهادة تشغيل معتمدة عالميًا لمحطات معالجة المياه، تثبت جاهزيتك الفنية لهذا المجال المتخصص"
    - name: "Reverse Osmosis & Membrane Technology Certificate"
      reason: "تقنية التناضح العكسي أساسية بمحطات تحلية وتنقية المياه بالسعودية، ومعرفتك بها ميزة واضحة"
  advice: "أبرز بسيرتك نوع محطات المعالجة التي عملت بها (تحلية، صرف صحي، مياه صناعية) فلكل نوع متطلبات مختلفة. متابعتك لمعايير الجودة والامتثال البيئي بمجال المياه تُحسب لك بقوة."

coatings:
  certifications:
    - name: "NACE Coating Inspector Program (CIP Level 1)"
      reason: "الشهادة المرجعية عالميًا بفحص الطلاءات الواقية للمنشآت الصناعية والبحرية، مطلوبة بكثرة بمشاريع النفط والغاز"
    - name: "ICorr Painting Inspector Certificate"
      reason: "شهادة بريطانية معتمدة بفحص وتقييم أعمال الطلاء والدهانات الصناعية"
  advice: "اذكر بسيرتك أنواع الأسطح والبيئات التي عملت بها (بحرية، صناعية، مدفونة) فهذا يوضّح مستوى خبرتك الفعلي. معرفتك بمعايير الحماية من التآكل تُعتبر نقطة قوة كبيرة بهذا المجال."

project_controls:
  certifications:
    - name: "PMI Scheduling Professional (PMI-SP)"
      reason: "شهادة متخصصة بجدولة المشاريع من معهد إدارة المشاريع العالمي، مطلوبة بكثرة بمشاريع الإنشاءات الكبرى"
    - name: "Primavera P6 Certified Practitioner"
      reason: "برنامج Primavera P6 هو المعيار الفعلي لضبط جداول المشاريع بالسعودية، وإتقانه ميزة تنافسية مباشرة"
  advice: "أبرز بسيرتك حجم المشاريع التي أدرت جدولتها أو تكلفتها بأرقام (الميزانية، المدة، عدد الأنشطة). معرفتك بتحليل الانحرافات وإعداد تقارير التقدّم الدورية نقطة تميّزك عن غيرك."

supply_chain:
  certifications:
    - name: "CIPS Diploma in Procurement and Supply"
      reason: "شهادة معتمدة عالميًا بالمشتريات وسلسلة الإمداد، معترف بها بقوة لدى الشركات الكبرى بالسعودية"
    - name: "APICS Certified Supply Chain Professional (CSCP)"
      reason: "تغطي كامل سلسلة الإمداد من التخطيط للتوريد، وترفع فرصك بمناصب التخطيط والتنسيق اللوجستي"
  advice: "اذكر بسيرتك حجم العقود أو المشتريات التي تعاملت معها بأرقام تقريبية، فهذا يعطي صورة واضحة عن مستوى مسؤوليتك السابقة. مهارات التفاوض مع الموردين وإدارة المخزون تستحق ذكرًا صريحًا."

admin:
  certifications:
    - name: "PMP (Project Management Professional)"
      reason: "حتى بالأعمال الإدارية، إتقان أساسيات إدارة المشاريع يميّزك عند التقدم لمناصب تنسيق أعلى"
    - name: "Certified Administrative Professional (CAP)"
      reason: "شهادة معتمدة دوليًا للأعمال الإدارية والدعم المكتبي، تثبت احترافيتك بهذا المجال"
  advice: "أبرز بسيرتك الأنظمة والبرامج التي تجيد استخدامها فعليًا (Excel المتقدم، أنظمة إدارة المكاتب) بدل وصف عام. القدرة على تنظيم الوقت وإدارة عدة مهام بالتوازي نقطة يبحث عنها كل مدير عند التوظيف."

hospitality:
  certifications:
    - name: "Certified Hospitality Supervisor (CHS)"
      reason: "شهادة معتمدة من الجمعية الأمريكية للفندقة، تناسب من يريد التقدم لمناصب إشرافية بالضيافة"
    - name: "HACCP Food Safety Certificate"
      reason: "شهادة سلامة غذائية أساسية بأي منشأة ضيافة أو مطاعم، وتُطلب غالبًا كشرط توظيف"
  advice: "اذكر بسيرتك أرقامًا ملموسة إن أمكن (تقييم رضا نزلاء، حجم فريق أشرفت عليه). مهارات التعامل مع الضيوف وحل المشكلات بسرعة تُعتبر من أهم ما يُقيّم به موظف الضيافة."

customer_ops:
  certifications:
    - name: "Certified Customer Experience Professional (CCXP)"
      reason: "شهادة معتمدة عالميًا بتجربة العملاء، تناسب من يريد التقدم لمناصب إشرافية بخدمة العملاء"
    - name: "COPC Customer Experience Standard"
      reason: "معيار عالمي معروف بجودة مراكز الاتصال، ومعرفتك به تميّزك بمقابلات هذا المجال"
  advice: "أبرز بسيرتك أرقامًا تعكس أداءك (نسبة رضا العملاء، متوسط زمن الحل) إن توفرت لديك. مهارات التعامل مع الشكاوى الصعبة بهدوء واحترافية نقطة تُقيّم بها بقوة بهذا المجال."

finance_accounting:
  certifications:
    - name: "زمالة الهيئة السعودية للمراجعين والمحاسبين (SOCPA)"
      reason: "الاعتماد المهني المرجعي بالسعودية لمزاولة المحاسبة والمراجعة، ويُطلب صراحة بكثير من الوظائف المالية"
    - name: "Certified Management Accountant (CMA)"
      reason: "شهادة عالمية بالمحاسبة الإدارية والتحليل المالي، تفتح أبواب مناصب أعلى بالإدارة المالية"
  advice: "اذكر بسيرتك الأنظمة المحاسبية التي تجيد استخدامها فعليًا (SAP، Oracle، QuickBooks) فهذا أهم بكثير من وصف عام لخبرتك. الدقة والالتزام بالمواعيد بالتقارير المالية نقطتان أساسيتان بهذا المجال."

hr_recruiting:
  certifications:
    - name: "SHRM Certified Professional (SHRM-CP)"
      reason: "من أكثر شهادات الموارد البشرية اعترافًا عالميًا، وتثبت إلمامك بأفضل الممارسات بإدارة الموظفين"
    - name: "Professional in Human Resources – International (PHRi)"
      reason: "شهادة معتمدة تناسب أسواق الموارد البشرية بالمنطقة، وتشمل الأنظمة والتوظيف والتعويضات"
  advice: "أبرز بسيرتك أرقامًا تعكس نجاحك (نسبة إكمال التوظيف، معدل الاحتفاظ بالموظفين) إن توفرت لديك. معرفتك بنظام العمل السعودي وبرنامج نطاقات نقطة قوة كبيرة بهذا المجال."

it_software:
  certifications:
    - name: "AWS Certified Cloud Practitioner"
      reason: "أساس معتمد بالحوسبة السحابية من أكبر مزوّد عالميًا، ومطلوب بكثرة حتى بالوظائف غير المتخصصة بالسحابة تحديدًا"
    - name: "CompTIA Network+"
      reason: "شهادة أساسية معترف بها عالميًا بالشبكات، تناسب من يريد إثبات أساسيات تقنية قوية"
  advice: "اذكر بسيرتك مشاريع فعلية بنيتها أو ساهمت بها (حتى الشخصية منها) مع الأدوات المستخدمة تحديدًا. سوق تقنية المعلومات بالسعودية يقدر من يستمر بالتعلم الذاتي، فاذكر أي دورة أو مسار تعلّم حديث أنهيته."

logistics_ops:
  certifications:
    - name: "Chartered Institute of Logistics and Transport (CILT) Diploma"
      reason: "شهادة معتمدة عالميًا بإدارة اللوجستيات والنقل، معترف بها بقوة لدى شركات الشحن والمستودعات بالسعودية"
    - name: "APICS Certified in Logistics, Transportation and Distribution (CLTD)"
      reason: "تغطي إدارة المستودعات والنقل والتوزيع معًا، وترفع فرصك بمناصب تنسيق العمليات اللوجستية"
  advice: "اذكر بسيرتك حجم العمليات التي أدرتها (عدد الشحنات، سعة المستودع) بأرقام تقريبية إن أمكن. معرفتك بأنظمة إدارة المستودعات (WMS) نقطة تميز واضحة بسوق اللوجستيات الحالي."

construction_pm:
  certifications:
    - name: "PMP (Project Management Professional)"
      reason: "الشهادة المرجعية عالميًا بإدارة المشاريع، ومطلوبة بكثرة بمشاريع الإنشاءات الكبرى بالسعودية (رؤية 2030)"
    - name: "اعتماد الهيئة السعودية للمهندسين (SCE)"
      reason: "اعتماد مهني إلزامي لممارسة الهندسة بالسعودية، ووجوده بسيرتك يزيل أي عائق إداري أمام توظيفك"
  advice: "أبرز بسيرتك حجم المشاريع التي عملت بها (القيمة، المدة، عدد الفرق) فهذا يعطي صورة واضحة لمسؤولياتك السابقة. الالتزام بجداول التنفيذ ومعايير السلامة بالمواقع نقطتان أساسيتان بتقييم أي مهندس إنشاءات."

marketing_comms:
  certifications:
    - name: "Google Analytics Certification"
      reason: "شهادة مجانية معتمدة تثبت قدرتك على قياس أداء الحملات التسويقية بالبيانات، أساسية بأي دور تسويق رقمي حاليًا"
    - name: "HubSpot Content Marketing Certification"
      reason: "شهادة معتمدة بالتسويق بالمحتوى، مطلوبة بكثرة بوظائف الاتصال والتسويق الرقمي"
  advice: "اذكر بسيرتك نتائج ملموسة لأي حملة شاركت بها (نسبة تفاعل، عدد متابعين، وصول) بدل وصف عام. إتقانك لأدوات تصميم أو تحليل محددة (Canva، Meta Business Suite) نقطة تميز واضحة."

program_admin_ops:
  certifications:
    - name: "Program Management Professional (PgMP)"
      reason: "شهادة متقدمة من معهد إدارة المشاريع العالمي لإدارة برامج متعددة المشاريع، تناسب من يدير عمليات أوسع من مشروع واحد"
    - name: "PMP (Project Management Professional)"
      reason: "أساس قوي لأي دور بإدارة البرامج والعمليات، ومعترف به بقوة لدى الشركات والجهات الحكومية بالسعودية"
  advice: "أبرز بسيرتك عدد المشاريع أو المبادرات التي نسّقتها بالتوازي وحجم الفرق المرتبطة بها. مهارات التواصل مع أصحاب المصلحة المختلفين وإعداد التقارير الدورية نقطتان تُقيّمان بقوة بهذا المجال."

legal_compliance:
  certifications:
    - name: "Certified Compliance & Ethics Professional (CCEP)"
      reason: "شهادة معتمدة عالميًا بالامتثال المؤسسي، مطلوبة بكثرة بالشركات الكبرى والقطاع المالي بالسعودية"
    - name: "الزمالة أو الترخيص القانوني المعتمد من هيئة الخبراء/المحاماة"
      reason: "الترخيص الرسمي لممارسة العمل القانوني بالسعودية شرط أساسي بكثير من الوظائف بهذا المجال"
  advice: "اذكر بسيرتك مجالات الاختصاص القانوني تحديدًا (تجاري، عمالي، امتثال) بدل وصف عام لخبرتك القانونية. متابعتك للأنظمة والتعاميم الحديثة ذات الصلة بمجالك نقطة تُقيّم بها إيجابًا."
