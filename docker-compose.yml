# مسار Core — البنية التحتية للمرحلتين 1 و2
# الخدمات: postgres (قاعدة البيانات)، gotenberg (تحويل HTML إلى PDF)،
# core (خدمة FastAPI)، core-scheduler (الجامع الدوري كل 30 دقيقة، المرحلة 2)،
# caddy (HTTPS تلقائيًا عبر دومين)، n8n (أتمتة سير العمل، مستضاف ذاتيًا).
#
# قبل التشغيل: انسخ .env.example إلى .env وعدّل القيم (خصوصًا كلمة مرور
# Postgres والدومين المستخدم لـCaddy).

services:
  # B6 (تصليب الحمل لـ1,500 عميل، docs/reports/B6-executor.md بند 8):
  # تُضبط قيم postgres وحدود الذاكرة لكل خدمة صراحة كي تتّسق 4 GB الخادم
  # كاملة (Hetzner CX23) — مجموع الحدود القصوى أدناه ≈ 3.26 GB، هامش
  # ~0.5 GB لنواة النظام + عمليات docker نفسها. shared_buffers=256MB (رُفع
  # من افتراضي Postgres 128MB) + work_mem=8MB (يخدم فرز/تجميع استعلامات
  # المخطِّط/المُرسِل بلا اللجوء لملفات مؤقتة على القرص لكل اتصال من حتى
  # ~40 اتصال متزامن ممكنة من core+core-scheduler معًا — راجع
  # core/app/discovery.py:get_engine) + effective_cache_size=1536MB (تقدير
  # متحفّظ لذاكرة الصفحات المتاحة فعليًا لـPostgres بعد حجز بقية الخدمات،
  # لا تخصيص فعلي — مجرد تلميح للمخطِّط) + max_connections=120 (رُفع من
  # الافتراضي 100: نفس العنقود يخدم أيضًا قاعدة بيانات n8n المنفصلة).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=120"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masar}
      POSTGRES_USER: ${POSTGRES_USER:-masar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?يجب تعيين POSTGRES_PASSWORD في .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - masar_internal
    # لا نفتح المنفذ للخارج — فقط الخدمات داخل الشبكة الداخلية تصل له

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--api-timeout=60s"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - masar_internal

  # mailpit: صندوق sink للتطوير/الاختبار المحلي (B4، الدليل: "DRY_RUN
  # افتراضي؛ لا اتصال SMTP حقيقي؛ sink = mailpit داخل compose" — تصحيح
  # Critical 2 بمراجعة B4 الأوفلاين، docs/reports/B4-offline-review.md).
  # شبكة داخلية فقط (masar_internal، لا masar_public) — لا يُنشر أي منفذ
  # للخارج عمدًا: SMTP (1025) وواجهة الويب/HTTP API (8025) يصلان فقط من
  # core/core-scheduler داخل الشبكة الداخلية. core.app.sender يستهدفه عبر
  # MAIL_SINK_SMTP=mailpit:1025، وcore.app.mail_api (`GET /admin/mail/sink/messages`)
  # عبر MAIL_SINK_API_URL=http://mailpit:8025 (واجهة mailpit HTTP API
  # `GET /api/v1/messages` — تُقرأ من خلف توكن الإدارة، لا تُنشر مباشرة).
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    # B6 بند 7: سقف احتفاظ بالرسائل (--max) — اختبار الحمل الحيّ (حتى 500
    # رسالة، deploy/ops/scripts/load_test.sh) والاستخدام التطويري العادي
    # قد يُنتجان آلاف الرسائل بمرور الوقت بلا هذا السقف؛ mailpit يحذف
    # الأقدم تلقائيًا عند تجاوزه فلا يمتلئ القرص (40GB الخادم مشترك مع كل
    # شيء آخر).
    command: ["--max", "2000"]
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - masar_internal
    # لا `ports:` هنا عمدًا (لا نشر علني) — فقط `expose` داخل الشبكة الداخلية.
    expose:
      - "1025"
      - "8025"

  core:
    build:
      context: ./core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-masar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-masar}
      GOTENBERG_URL: http://gotenberg:3000
      CORE_ADMIN_TOKEN: ${CORE_ADMIN_TOKEN:?يجب تعيين CORE_ADMIN_TOKEN في .env}
      MASAR_DOMAIN: ${MASAR_DOMAIN:-}
      OPS_DIR: /ops
      REPO_DIR: /repo
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN:-}
      DATA_DIR: /app/data
      # B8 (إزالة n8n من مسار تيليجرام): توكنات بوتي تيليجرام (عملاء/إدارة)،
      # معرّف محادثة المالك، وسرّ الـwebhook — core.app.telegram_api يحتاجها
      # كلها مباشرة (نقطة /telegram/webhook/{token} تُعطِّل نفسها 503 بلا
      # TELEGRAM_WEBHOOK_SECRET، تمامًا مثل MCP_BRIDGE_TOKEN أعلاه).
      TELEGRAM_CUSTOMER_BOT_TOKEN: ${TELEGRAM_CUSTOMER_BOT_TOKEN:-}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      MASAR_OWNER_CHAT_ID: ${MASAR_OWNER_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # B4 — تصحيح Critical 1/2 بمراجعة B4 الأوفلاين: بلا هذه المتغيرات
      # داخل بيئة الحاوية فعليًا (compose لا يمرّر .env تلقائيًا للحاوية —
      # فقط يستبدلها ذاتيًا بـ${VAR} هنا)، كل تشفير/فك تشفير سرّ بريد يفشل
      # دومًا (MailCryptoUnavailable)، ولا مسار sink قابل للتفعيل إطلاقًا.
      MAIL_FERNET_KEY: ${MAIL_FERNET_KEY:-}
      # تصحيح 11 سبتمبر (اكتشاف أثناء تفعيل الإرسال الحي الأول): الصيغة
      # القديمة `${MAIL_SINK_SMTP:-mailpit:1025}` (بنقطتين) تُطبّق القيمة
      # الافتراضية أيضًا حين تكون MAIL_SINK_SMTP مضبوطة صراحةً بـ.env لكن
      # **فارغة** (نفس معاملة "غير معرَّفة" — دلالة `:-` القياسية بكل من
      # bash وDocker Compose) — ما كان يجعل تعطيل sink عبر ".env فارغ"
      # مستحيلًا فعليًا بلا تعديل هذا الملف نفسه أيضًا. الصيغة الجديدة بلا
      # نقطتين (`${VAR-default}`) تُفرّق بين "غير معرَّفة إطلاقًا" (لا يوجد
      # سطر MAIL_SINK_SMTP بـ.env أصلًا → mailpit:1025 كما كان دومًا، يبقى
      # الافتراضي الآمن لأي بيئة تطوير لا تضبط شيئًا) وبين "معرَّفة صراحةً
      # وفارغة" (سطر `MAIL_SINK_SMTP=` بـ.env → قيمة فعلية فارغة تصل
      # للحاوية → core.app.sender.resolve_transport يتعامل معها كـ"sink
      # غير مفعّل" فعليًا، يسمح بوضع الإرسال الحي الحقيقي عبر MAIL_LIVE=true).
      MAIL_SINK_SMTP: ${MAIL_SINK_SMTP-mailpit:1025}
      MAIL_SINK_API_URL: ${MAIL_SINK_API_URL:-http://mailpit:8025}
      DRY_RUN_TO: ${DRY_RUN_TO:-}
      MAIL_LIVE: ${MAIL_LIVE:-false}
      MAIL_IGNORE_SEND_WINDOW: ${MAIL_IGNORE_SEND_WINDOW:-false}
      CV_DATA_DIR: /data/cv
      # B6 (تصليب الحمل، docs/reports/B6-executor.md بند 3): مجمّع اتصالات
      # core (API — طلبات قصيرة، لا SEND_WORKERS): 10+5=15 كحد أقصى. بلا
      # statement_timeout صريح (طلبات إدارية بطيئة مشروعة مثل
      # `/admin/quality-sample` يجب ألا تُقطَع)، وlock_timeout الافتراضي
      # (5 ثوانٍ بكود core/app/discovery.py:get_engine) يكفي لعزل API عن
      # قفل عالق بمعاملة أخرى.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_RECYCLE_SECONDS: "1800"
      DB_LOCK_TIMEOUT_MS: "5000"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      # مجلد "ops runner" (B1a): مشترك مع المضيف — core يكتب طلبات تنفيذ
      # هنا (/ops/queue) وسكربت autodeploy على المضيف (خارج أي حاوية) يقرأها
      # وينفذها، ثم يكتب النتيجة (/ops/results) ليقرأها core. هذا بديل
      # عن SSH أو تركيب Docker socket داخل الحاوية.
      - ./ops:/ops
      # جسر MCP (B1b): تركيب للقراءة فقط لجذر المستودع — أدوات repo_read/
      # repo_list تقرأ منه مباشرة؛ الكتابة الفعلية (repo_write) تمر عبر
      # staging + قائمة انتظار ops أعلاه، لأن هذا التركيب read-only عمدًا.
      - ./:/repo:ro
      # بيانات الاكتشاف (B2): معجم taxonomy_local.yaml وsources_seed.csv —
      # للقراءة فقط، مركّبة مباشرة (بلا إعادة بناء الصورة) حتى يعكس أي
      # تحديث للملف أثره فورًا بعد إعادة تشغيل الحاوية القادمة (autodeploy
      # يعيد "up -d --build" على كل تغيير على أي حال). core نفسها تحتاجها
      # أيضًا لأن /admin/discovery/run-now و/admin/discovery/seed-sources
      # يُنفّذان داخل عملية core (FastAPI) بواسطة BackgroundTasks.
      - ./data:/app/data:ro
      # ملفات السيرة الذاتية المولّدة (B4، cv_builder.CV_DATA_DIR) — volume
      # مُسمّى مشترك مع core-scheduler (تصحيح Medium 2 بمراجعة B4 الأوفلاين):
      # queue-now يدوي من core وإرسال تلقائي من core-scheduler قد يفصل
      # بينهما ساعات؛ بلا volume مشترك يُفقد ملف PDF عند أي إعادة نشر
      # ويُرسَل البريد بلا مرفق سيرة ذاتية بصمت.
      - cv_data:/data/cv
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - masar_internal
      - masar_public
    expose:
      - "8000"

  core-scheduler:
    build:
      context: ./core
    command: ["python", "-m", "app.scheduler_main"]
    restart: unless-stopped
    # تصحيح F3 (مراجعة حيّة docs/reports/B3B4-live-review.md، استنتاج متوسط 1):
    # core-scheduler يُبنى من نفس core/Dockerfile مثل core فيرث HEALTHCHECK
    # الموروث الذي يفحص http://localhost:8000/health — لكن هذه الخدمة عملية
    # خلفية فقط (APScheduler.BlockingScheduler)، لا تفتح المنفذ 8000 إطلاقًا،
    # فالفحص يفشل دومًا بالتصميم بصرف النظر عن سلامة العملية الفعلية (مؤكّد
    # حيًا بسجلّات تكات ناجحة متواصلة بلا انقطاع رغم "unhealthy" بـdocker ps).
    # تعطيل الفحص الموروث هنا بدل حذفه من Dockerfile يُبقي core (التي تحتاجه
    # فعلاً) بلا تأثير.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-masar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-masar}
      GOTENBERG_URL: http://gotenberg:3000
      DATA_DIR: /app/data
      # B8 (إزالة n8n من مسار تيليجرام): نفس متغيرات تيليجرام أعلاه —
      # core-scheduler هو من يرسل التقارير اليومية/التذكيرات عبر
      # app.telegram_notify/telegram_notify_admin (reports_relay.py،
      # retention.py، skill_gap.py)، فيحتاجها للإرسال الصادر تمامًا كما
      # تحتاجها core للـwebhook الوارد.
      TELEGRAM_CUSTOMER_BOT_TOKEN: ${TELEGRAM_CUSTOMER_BOT_TOKEN:-}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      MASAR_OWNER_CHAT_ID: ${MASAR_OWNER_CHAT_ID:-}
      # نفس متغيّرات core أعلاه بالضبط — core-scheduler هو من يبني الطابور
      # فعليًا (send_builder، كل 10 دقائق) ويرسل (sender، كل دقيقة) ويقرأ
      # الوارد (inbox، كل 15 دقيقة)، فيحتاجها جميعًا لا core وحدها.
      MAIL_FERNET_KEY: ${MAIL_FERNET_KEY:-}
      # نفس تصحيح 11 سبتمبر أعلاه بخدمة core — راجع التعليق هناك (بلا
      # نقطتين كي يُحترَم سطر ".env فارغ صراحةً" لا أن يُعامَل كـ"غير معرَّف").
      MAIL_SINK_SMTP: ${MAIL_SINK_SMTP-mailpit:1025}
      MAIL_SINK_API_URL: ${MAIL_SINK_API_URL:-http://mailpit:8025}
      DRY_RUN_TO: ${DRY_RUN_TO:-}
      MAIL_LIVE: ${MAIL_LIVE:-false}
      MAIL_IGNORE_SEND_WINDOW: ${MAIL_IGNORE_SEND_WINDOW:-false}
      CV_DATA_DIR: /data/cv
      # B6 (تصليب الحمل، docs/reports/B6-executor.md بنود 3-5): core-scheduler
      # يحتاج مجمّع اتصالات أكبر من core (SEND_WORKERS خيطًا حتى 20، كل خيط
      # يفتح اتصاله الخاص بمعاملة قصيرة عبر engine.begin() — راجع sender.py).
      # statement_timeout مُفعَّل هنا تحديدًا (لا بـcore): استعلامات الجامع/
      # الإرسال/الوارد الدورية يجب ألا تُعلِّق العملية الخلفية بأكملها للأبد
      # على استعلام واحد عالق (30 ثانية سخية كفاية لأي استعلام مخطَّط منها
      # حتى بحمل 1,500 عميل، وأقل بكثير من دورة التخطيط الكاملة ~22 ثانية
      # المقيسة محليًا — راجع docs/reports/B6-executor.md).
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "15"
      DB_POOL_RECYCLE_SECONDS: "1800"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      DB_LOCK_TIMEOUT_MS: "5000"
      # حدود/وتيرة الإرسال (B6 بند 4) — القيم أدناه = نفس افتراضيات الكود
      # (sender.py) صراحةً هنا لسهولة الضبط المستقبلي بلا تعديل كود.
      SEND_WORKERS: "20"
      SEND_MAILBOX_MIN_INTERVAL_SECONDS: "6"
      SEND_GLOBAL_RATE_PER_SECOND: "20"
      SEND_MAX_ATTEMPTS: "3"
      # تقسيم قارئ الوارد عبر التكات (B6 بند 5) — 15 قسمًا × تكة كل 15 دقيقة
      # = كل صندوق يُفحص مرة كل ~3.75 ساعة (راجع تعليق core/app/inbox.py).
      INBOX_PARTITION_COUNT: "15"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      # نفس ملاحظة data أعلاه — الجامع نفسه (core.app.discovery) يقرأ
      # taxonomy_local.yaml لتصنيف العائلة المهنية وsources_seed.csv للبذر
      # عند كل إقلاع.
      - ./data:/app/data:ro
      # نفس volume السيرة الذاتية المشترك مع core أعلاه (تصحيح Medium 2).
      - cv_data:/data/cv
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - masar_internal
      - masar_public   # الجامع يحتاج وصولًا للإنترنت لقراءة المصادر (masar_internal شبكة مغلقة)
    # لا يحتاج منفذًا خارجيًا — عملية خلفية فقط (الجامع كل 30 دقيقة)

  # n8n-db-init: خدمة تُشغّل مرة واحدة عند كل تشغيل (idempotent) لإنشاء قاعدة
  # بيانات "n8n" داخل نفس خادم Postgres المشترك، إن لم تكن موجودة أصلًا.
  n8n-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER:-masar}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-masar}
    command:
      - sh
      - -c
      - |
        set -e
        i=0
        until pg_isready -h postgres -U "$$PGUSER" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "postgres غير جاهز بعد 60 ثانية" >&2
            exit 1
          fi
          sleep 2
        done
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='n8n'" | grep -q 1 || psql -c 'CREATE DATABASE n8n'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - masar_internal

  # n8n: أتمتة سير العمل، مستضافة ذاتيًا على نفس الخادم (بدلًا من n8n Cloud).
  # تستخدم قاعدة بيانات Postgres منفصلة ("n8n") داخل نفس عنقود قاعدة البيانات،
  # وتُنشر عبر Caddy على n8n.<MASAR_DOMAIN>.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${MASAR_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.${MASAR_DOMAIN}/
      WEBHOOK_URL: https://n8n.${MASAR_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Riyadh
      TZ: Asia/Riyadh
      # مفتاح التشفير: لا نمررّه كمتغير بيئة عمدًا — n8n يولّده عند أول إقلاع
      # ويحفظه في /home/node/.n8n/config داخل volume n8n_data (مصدر الحقيقة
      # الوحيد؛ backup.sh ينسخه). تمرير مفتاح مختلف عبر البيئة يمنع n8n من الإقلاع.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-masar}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      n8n-db-init:
        condition: service_completed_successfully
    networks:
      - masar_internal
      - masar_public
    expose:
      - "5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MASAR_DOMAIN: "${MASAR_DOMAIN:?يجب تعيين MASAR_DOMAIN في .env (مثال - core.example.com)}"
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - core
      - n8n
    networks:
